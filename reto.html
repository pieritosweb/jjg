<script>
const SUPABASE_URL = "https://saejzjhxarlbdmrgjeuc.supabase.co/";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhZWp6amh4YXJsYmRtcmdqZXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMjM1NTgsImV4cCI6MjA5Nzg5OTU1OH0.pG6hVqYmt2CSjxx5iHcz1Hm3DzNGScyP0P4SlP4Qxzo";
const sbClient = window.supabase.createClient(SUPABASE_URL.replace(/\/$/,""), SUPABASE_KEY, {

const params = new URLSearchParams(location.search);
const retoSlug = params.get("r");
let usuarioActual = null;
let reto = null;

function formatoWhatsapp(texto){
  if (!texto) return "";
  let resultado = texto
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(\S(?:[^*]*\S)?)\*/g, "<strong>$1</strong>")
    .replace(/_(\S(?:[^_]*\S)?)_/g, "<em>$1</em>")
    .replace(/~(\S(?:[^~]*\S)?)~/g, "<s>$1</s>");
  resultado = resultado.replace(/(https?:\/\/[^\s<]+)/g, (match, url, offset, str) => {
    const antes = str.slice(0, offset);
    const aberturasA = (antes.match(/<a /g) || []).length;
    const cierresA = (antes.match(/<\/a>/g) || []).length;
    if (aberturasA > cierresA) return match;
    return `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
  });
  return resultado;
}

function render(html){ document.getElementById("contenido").innerHTML = html; }

function resolverWspLocal(userId){
  return localStorage.getItem("jjg_wsp_" + userId) || null;
}

async function init(){
  if (!retoSlug) { render('<div class="estado-msg">Este link no es válido. Pídele el link correcto a quien te lo compartió. 🌿</div>'); return; }

  const { data: { session } } = await sbClient.auth.getSession();
  if (session?.user) {
    usuarioActual = {
      id: session.user.id,
      nombre: session.user.user_metadata?.full_name || session.user.email,
      email: session.user.email,
      wsp: resolverWspLocal(session.user.id),
      access_token: session.access_token
    };
  }

  try {
    const res = await fetch(`${SUPABASE_URL}rest/v1/retos?slug=eq.${encodeURIComponent(retoSlug)}&select=*`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    reto = data?.[0];
  } catch (e) { reto = null; }

  if (!reto || !reto.activo) {
    render('<div class="estado-msg">Este reto ya no está disponible. 🌿</div>');
    return;
  }

  if (reto.finalizado) {
    render('<div class="estado-msg">Este reto ya no acepta más inscripciones ni respuestas. ¡Gracias por tu interés! 🌿</div>');
    return;
  }

  if (!usuarioActual) {
    render(`
      <div class="icono">🎯</div>
      <h1>${formatoWhatsapp(reto.titulo)}</h1>
      <div class="desc">${formatoWhatsapp(reto.descripcion)}</div>
      <button class="btn-google" onclick="loginGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>
        Ingresar con Google para inscribirme
      </button>
    `);
    return;
  }

  if (!usuarioActual.wsp) {
    render(`
      <div class="icono">🎯</div>
      <h1>${formatoWhatsapp(reto.titulo)}</h1>
      <div class="desc">${formatoWhatsapp(reto.descripcion)}</div>
      <div class="form-group">
        <label>Tu WhatsApp (para coordinar contigo)</label>
        <input type="tel" id="fWspInicial" placeholder="Ej: 987654321" maxlength="9">
      </div>
      <button onclick="guardarWspInicial()">Continuar</button>
    `);
    return;
  }

  const tienePreguntas = Array.isArray(reto.preguntas) && reto.preguntas.length > 0;
  if (tienePreguntas) {
    renderFormularioPersonalizado();
    return;
  }

  let yaInscrito = false;
  try {
    const res = await fetch(`${SUPABASE_URL}rest/v1/retos_inscripciones?reto_id=eq.${reto.id}&email=eq.${encodeURIComponent(usuarioActual.email)}&select=id`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    yaInscrito = Array.isArray(data) && data.length > 0;
  } catch (e) {}

  if (yaInscrito) {
    render(`
      <div class="ok-msg">
        <div class="icono">✅</div>
        <h1>${formatoWhatsapp(reto.titulo)}</h1>
        <div class="desc">Ya estás inscrito en este reto. ¡Nos vemos en el grupo! 🌿</div>
      </div>
    `);
    return;
  }

  render(`
    <div class="icono">🎯</div>
    <h1>${formatoWhatsapp(reto.titulo)}</h1>
    <div class="desc">${formatoWhatsapp(reto.descripcion)}</div>
    <div class="form-group">
      <label>Tu nombre</label>
      <input type="text" id="fNombre" value="${usuarioActual.nombre || ""}">
    </div>
    <div class="form-group">
      <label>Tu WhatsApp</label>
      <input type="tel" id="fWsp" placeholder="Ej: 987654321" maxlength="9">
    </div>
    <div class="form-group">
      <label>¿Alguna pregunta o comentario? (opcional)</label>
      <textarea id="fPregunta" placeholder="Escribe aquí si tienes alguna duda..."></textarea>
    </div>
    <button id="btnConfirmar" onclick="confirmarInscripcion()">✅ Confirmar inscripción</button>
  `);

  const inputWsp = document.getElementById("fWsp");
  inputWsp.addEventListener("input", () => { inputWsp.value = inputWsp.value.replace(/\D/g, ""); });
}

async function loginGoogle(){
  await sbClient.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.href }
  });
}

async function confirmarInscripcion(){
  const nombre = document.getElementById("fNombre").value.trim();
  const wsp = document.getElementById("fWsp").value.trim();
  const pregunta = document.getElementById("fPregunta").value.trim();
  if (!nombre) { alert("Ponle tu nombre"); return; }
  if (!wsp || wsp.length < 9) { alert("WhatsApp inválido"); return; }
  const btn = document.getElementById("btnConfirmar");
  btn.disabled = true; btn.textContent = "Enviando...";
  try {
    await fetch(`${SUPABASE_URL}rest/v1/retos_inscripciones`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ reto_id: reto.id, email: usuarioActual.email, nombre, wsp, pregunta: pregunta || null })
    });
    render(`
      <div class="ok-msg">
        <div class="icono">✅</div>
        <h1>¡Ya estás inscrito!</h1>
        <div class="desc">Nos vemos en el grupo. 🌿</div>
      </div>
    `);
  } catch (e) {
    btn.disabled = false; btn.textContent = "✅ Confirmar inscripción";
    alert("Hubo un error, intenta de nuevo.");
  }
}

function guardarWspInicial(){
  const wsp = document.getElementById("fWspInicial").value.trim().replace(/\D/g,"");
  if (!wsp || wsp.length < 9) { alert("WhatsApp inválido"); return; }
  localStorage.setItem("jjg_wsp_" + usuarioActual.id, wsp);
  usuarioActual.wsp = wsp;
  init();
}

function renderCampoPregunta(p, idx, valorExistente){
  const nombreCampo = `preg_${idx}`;
  const marcaReq = p.requerido ? ' *' : '';
  if (p.tipo === "texto") {
    const v = (typeof valorExistente === "string" ? valorExistente : "").replace(/"/g, "&quot;");
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label><input type="text" id="${nombreCampo}" value="${v}"></div>`;
  }
  if (p.tipo === "parrafo") {
    const v = typeof valorExistente === "string" ? valorExistente : "";
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label><textarea id="${nombreCampo}">${v}</textarea></div>`;
  }
  if (p.tipo === "select") {
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label><select id="${nombreCampo}"><option value="">Selecciona...</option>${(p.opciones||[]).map(o=>`<option value="${o}" ${o===valorExistente?"selected":""}>${o}</option>`).join("")}</select></div>`;
  }
  if (p.tipo === "radio") {
    const esOtro = valorExistente && !(p.opciones||[]).includes(valorExistente);
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label>
      ${(p.opciones||[]).map(o => `<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:6px"><input type="radio" name="${nombreCampo}" value="${o}" style="width:auto" ${o===valorExistente?"checked":""}> ${o}</label>`).join("")}
      ${p.permiteOtro ? `<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:6px"><input type="radio" name="${nombreCampo}" value="__otro__" style="width:auto" ${esOtro?"checked":""}> Otro:</label><input type="text" id="${nombreCampo}_otro" placeholder="Especifica..." value="${esOtro?String(valorExistente).replace(/"/g,'&quot;'):''}">` : ""}
    </div>`;
  }
  if (p.tipo === "checkbox") {
    const seleccionados = Array.isArray(valorExistente) ? valorExistente : [];
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label>
      ${(p.opciones||[]).map(o => `<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:6px"><input type="checkbox" name="${nombreCampo}" value="${o}" style="width:auto" ${seleccionados.includes(o)?"checked":""}> ${o}</label>`).join("")}
      ${p.permiteOtro ? `<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:6px"><input type="checkbox" id="${nombreCampo}_otro_check" style="width:auto"> Otro:</label><input type="text" id="${nombreCampo}_otro" placeholder="Especifica...">` : ""}
    </div>`;
  }
  if (p.tipo === "imagen") {
    const existente = valorExistente && typeof valorExistente === "object" ? valorExistente : null;
    const urls = existente ? (Array.isArray(existente.urls) ? existente.urls : (existente.url ? [existente.url] : [])) : [];
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label>
      ${urls.length ? `<div style="margin-bottom:6px">${urls.map(u=>`<img src="${u}" style="max-width:64px;max-height:64px;border-radius:6px;margin-right:6px;object-fit:cover">`).join("")}</div><div style="font-size:0.72rem;color:var(--gris);margin-bottom:6px">Ya tienes foto(s) aquí — sube nuevas solo si quieres reemplazarlas</div>` : ""}
      <input type="file" id="${nombreCampo}" accept="image/*" multiple style="margin-bottom:4px">
      <div style="font-size:0.72rem;color:var(--gris);margin-bottom:8px">Puedes subir 1 o 2 fotos</div>
      <textarea id="${nombreCampo}_comentario" placeholder="Agrega un comentario (opcional)">${existente?.comentario || ""}</textarea>
    </div>`;
  }
  return "";
}

let historialRetoAbierto = false;
let historialRetoCache = null;

function renderFormularioPersonalizado(){
  document.getElementById("card").classList.remove("card-ancho");
  render(`
    <div class="icono">🎯</div>
    <h1>${formatoWhatsapp(reto.titulo)}</h1>
    <div class="desc">${formatoWhatsapp(reto.descripcion)}</div>
    <div style="font-size:0.82rem;color:var(--gris);margin-bottom:14px">Enviando como <strong>${usuarioActual.nombre}</strong> (${usuarioActual.wsp})</div>
    ${reto.preguntas.map((p, idx) => renderCampoPregunta(p, idx)).join("")}
    <button id="btnEnviarRespuesta" onclick="enviarRespuestaPersonalizada()">✅ Enviar entrada</button>
    <button type="button" class="btn-secundario" id="btnToggleHistorialReto" onclick="toggleHistorialReto()">📜 Ver mi historial</button>
    <div id="historialRetoWrap" style="display:none">
      <div id="historialRetoLista"></div>
    </div>
  `);
  if (historialRetoAbierto) mostrarHistorialRetoAbierto();
}

function mostrarHistorialRetoAbierto(){
  const wrap = document.getElementById("historialRetoWrap");
  const btn = document.getElementById("btnToggleHistorialReto");
  if (!wrap || !btn) return;
  wrap.style.display = "block";
  btn.textContent = "📜 Ocultar mi historial";
  if (historialRetoCache) {
    pintarHistorialReto(historialRetoCache);
  } else {
    cargarHistorialReto();
  }
}

async function toggleHistorialReto(){
  historialRetoAbierto = !historialRetoAbierto;
  const wrap = document.getElementById("historialRetoWrap");
  const btn = document.getElementById("btnToggleHistorialReto");
  if (!historialRetoAbierto) {
    wrap.style.display = "none";
    btn.textContent = "📜 Ver mi historial";
    return;
  }
  mostrarHistorialRetoAbierto();
}

async function cargarHistorialReto(){
  const cont = document.getElementById("historialRetoLista");
  cont.innerHTML = `<div class="estado-msg" style="padding:14px 0">Cargando...</div>`;
  try {
    const res = await fetch(
      `${SUPABASE_URL}rest/v1/retos_respuestas?reto_id=eq.${reto.id}&email=eq.${encodeURIComponent(usuarioActual.email)}&select=*&order=created_at.desc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    const filas = await res.json();
    historialRetoCache = Array.isArray(filas) ? filas : [];
    pintarHistorialReto(historialRetoCache);
  } catch (e) {
    cont.innerHTML = `<div class="estado-msg" style="padding:14px 0">No se pudo cargar tu historial, intenta de nuevo.</div>`;
  }
}

function pintarHistorialReto(filas){
  const cont = document.getElementById("historialRetoLista");
  if (!cont) return;
  if (!filas.length) {
    cont.innerHTML = `<div class="estado-msg" style="padding:14px 0">Todavía no tienes ninguna entrada registrada aquí. 🌱</div>`;
    return;
  }
  cont.innerHTML = `<div class="historial-lista">${filas.map(fila => renderHistorialItemReto(fila)).join("")}</div>`;
}

function abrirLightboxReto(url){
  let lb = document.getElementById("lightboxReto");
  if (!lb) {
    lb = document.createElement("div");
    lb.id = "lightboxReto";
    lb.className = "lightbox-reto";
    lb.innerHTML = `<button type="button" class="lightbox-reto-cerrar" onclick="cerrarLightboxReto()">✕</button><img id="lightboxRetoImg" src="">`;
    lb.addEventListener("click", (e) => { if (e.target === lb) cerrarLightboxReto(); });
    document.body.appendChild(lb);
  }
  document.getElementById("lightboxRetoImg").src = url;
  lb.classList.add("activo");
}
function cerrarLightboxReto(){
  const lb = document.getElementById("lightboxReto");
  if (lb) lb.classList.remove("activo");
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarLightboxReto(); });

function renderHistorialItemReto(fila){
  const fecha = new Date(fila.created_at).toLocaleString("es-PE", { dateStyle: "medium", timeStyle: "short", timeZone: "America/Lima" });
  const respuestas = fila.respuestas || {};
  const campos = Object.entries(respuestas).map(([etiqueta, valor]) => {
    let contenido;
    if (valor && typeof valor === "object" && ("urls" in valor || "url" in valor)) {
      const urls = Array.isArray(valor.urls) ? valor.urls : (valor.url ? [valor.url] : []);
      contenido = (urls.length ? `<div class="historial-imgs">${urls.map(u => `<img src="${u}" alt="" onclick="abrirLightboxReto('${u.replace(/'/g,"\\'")}')">`).join("")}</div>` : "")
        + (valor.comentario ? `<div style="margin-top:4px">${valor.comentario}</div>` : "");
    } else if (Array.isArray(valor)) {
      contenido = valor.join(", ");
    } else {
      contenido = valor || "<span style=\"color:#bbb\">—</span>";
    }
    return `<div><div class="historial-campo-etiqueta">${etiqueta}</div><div class="historial-campo-valor">${contenido}</div></div>`;
  }).join("");
  return `<div class="historial-item">
    <div class="historial-fecha">${fecha}</div>
    <div class="historial-campos">${campos}</div>
    <button type="button" class="btn-secundario" style="margin-top:8px;font-size:0.8rem;padding:6px 12px" onclick="abrirEdicionRespuestaUsuario(${fila.id})">✏️ Editar esta entrada</button>
    <button type="button" class="btn-secundario" style="margin-top:6px;font-size:0.8rem;padding:6px 12px;color:#c0392b;border-color:#c0392b" onclick="eliminarRespuestaUsuario(${fila.id})">🗑️ Eliminar esta entrada</button>
  </div>`;
}

async function eliminarRespuestaUsuario(respuestaId){
  if (!confirm("¿Eliminar esta entrada? No se puede deshacer.")) return;
  try {
    const res = await fetch(`${SUPABASE_URL}rest/v1/retos_respuestas?id=eq.${respuestaId}&email=eq.${encodeURIComponent(usuarioActual.email)}`, {
      method: "DELETE",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${usuarioActual.access_token || SUPABASE_KEY}`, Prefer: "return=representation" }
    });
    if (!res.ok) throw new Error();
    const filasEliminadas = await res.json();
    if (!Array.isArray(filasEliminadas) || filasEliminadas.length === 0) {
      alert("No se pudo eliminar: esta entrada ya no coincide con tu cuenta. Recarga la página e intenta de nuevo.");
      return;
    }
    historialRetoCache = historialRetoCache.filter(f => f.id !== respuestaId);
    pintarHistorialReto(historialRetoCache);
  } catch (e) {
    alert("No se pudo eliminar, intenta de nuevo.");
  }
}

function abrirEdicionRespuestaUsuario(respuestaId){
  const fila = (historialRetoCache || []).find(f => f.id === respuestaId);
  if (!fila) return;
  document.getElementById("card").classList.remove("card-ancho");
  render(`
    <div class="icono">✏️</div>
    <h1>Editar tu entrada</h1>
    <div class="desc">${formatoWhatsapp(reto.titulo)}</div>
    ${reto.preguntas.map((p, idx) => renderCampoPregunta(p, idx, (fila.respuestas || {})[p.etiqueta])).join("")}
    <button id="btnEnviarRespuesta" onclick="guardarEdicionRespuestaUsuario(${respuestaId})">💾 Guardar cambios</button>
    <button type="button" class="btn-secundario" onclick="renderFormularioPersonalizado()">← Cancelar</button>
  `);
}

async function guardarEdicionRespuestaUsuario(respuestaId){
  const btn = document.getElementById("btnEnviarRespuesta");
  const filaExistente = (historialRetoCache || []).find(f => f.id === respuestaId);
  const respuestas = {};

  for (let idx = 0; idx < reto.preguntas.length; idx++) {
    const p = reto.preguntas[idx];

    if (p.tipo === "imagen") {
      const fileInput = document.getElementById(`preg_${idx}`);
      const comentario = document.getElementById(`preg_${idx}_comentario`)?.value.trim() || "";
      const archivos = fileInput?.files ? Array.from(fileInput.files) : [];
      const valorPrevio = (filaExistente?.respuestas || {})[p.etiqueta] || {};

      if (archivos.length > 2) {
        alert(`Puedes subir máximo 2 imágenes para: "${p.etiqueta}"`);
        return;
      }
      if (archivos.length > 0) {
        btn.disabled = true; btn.textContent = archivos.length > 1 ? "Subiendo imágenes..." : "Subiendo imagen...";
        try {
          const urls = [];
          for (const archivo of archivos) urls.push(await subirImagenReto(archivo));
          respuestas[p.etiqueta] = { urls, comentario };
        } catch (e) {
          btn.disabled = false; btn.textContent = "💾 Guardar cambios";
          alert("No se pudo subir la imagen, intenta de nuevo.");
          return;
        }
      } else {
        // No subió fotos nuevas -- mantenemos las que ya tenía, solo actualizamos el comentario
        respuestas[p.etiqueta] = { urls: valorPrevio.urls || [], comentario };
      }
      if (p.requerido && (!respuestas[p.etiqueta].urls || respuestas[p.etiqueta].urls.length === 0)) {
        alert(`Por favor sube al menos 1 imagen para: "${p.etiqueta}"`);
        return;
      }
      continue;
    }

    const valor = leerValorPregunta(p, idx);
    const vacio = Array.isArray(valor) ? valor.length === 0 : !valor;
    if (p.requerido && vacio) {
      alert(`Por favor completa: "${p.etiqueta}"`);
      return;
    }
    respuestas[p.etiqueta] = valor;
  }

  btn.disabled = true; btn.textContent = "Guardando...";
  try {
    const res = await fetch(`${SUPABASE_URL}rest/v1/retos_respuestas?id=eq.${respuestaId}&email=eq.${encodeURIComponent(usuarioActual.email)}`, {
      method: "PATCH",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${usuarioActual.access_token || SUPABASE_KEY}`, "Content-Type": "application/json", Prefer: "return=representation" },
      body: JSON.stringify({ respuestas })
    });
    if (!res.ok) throw new Error();
    const filasActualizadas = await res.json();
    if (!Array.isArray(filasActualizadas) || filasActualizadas.length === 0) {
      // El PATCH "tuvo éxito" pero no encontró ninguna fila que coincida -- no lo tratamos como guardado
      btn.disabled = false; btn.textContent = "💾 Guardar cambios";
      alert("No se pudo guardar: esta entrada ya no coincide con tu cuenta. Recarga la página e intenta de nuevo, o contáctanos si sigue pasando.");
      return;
    }
    historialRetoCache = null;
    historialRetoAbierto = true;
    render(`
      <div class="ok-msg">
        <div class="icono">✅</div>
        <h1>¡Cambios guardados!</h1>
        <div class="desc">Tu entrada fue actualizada. 🌿</div>
        <button onclick="renderFormularioPersonalizado()">➕ Agregar otra entrada</button>
        <button type="button" class="btn-secundario" id="btnToggleHistorialReto" onclick="toggleHistorialReto()">📜 Ver mi historial</button>
        <div id="historialRetoWrap" style="display:none">
          <div id="historialRetoLista"></div>
        </div>
      </div>
    `);
    mostrarHistorialRetoAbierto();
  } catch (e) {
    btn.disabled = false; btn.textContent = "💾 Guardar cambios";
    alert("No se pudo guardar el cambio, intenta de nuevo.");
  }
}

function leerValorPregunta(p, idx){
  const nombreCampo = `preg_${idx}`;
  if (p.tipo === "texto" || p.tipo === "parrafo") return document.getElementById(nombreCampo).value.trim();
  if (p.tipo === "select") return document.getElementById(nombreCampo).value;
  if (p.tipo === "radio") {
    const el = document.querySelector(`input[name="${nombreCampo}"]:checked`);
    if (!el) return "";
    if (el.value === "__otro__") return document.getElementById(`${nombreCampo}_otro`)?.value.trim() || "";
    return el.value;
  }
  if (p.tipo === "checkbox") {
    const seleccionados = Array.from(document.querySelectorAll(`input[name="${nombreCampo}"]:checked`)).map(el => el.value);
    if (document.getElementById(`${nombreCampo}_otro_check`)?.checked) {
      const otroTexto = document.getElementById(`${nombreCampo}_otro`)?.value.trim();
      if (otroTexto) seleccionados.push(otroTexto);
    }
    return seleccionados;
  }
  return "";
}

async function comprimirImagenReto(file, maxDim, calidad){
  maxDim = maxDim || 1280;
  calidad = calidad || 0.8;
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("No se pudo comprimir")), "image/jpeg", calidad);
      };
      img.onerror = () => reject(new Error("Imagen inválida"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Error al leer el archivo"));
    reader.readAsDataURL(file);
  });
}

async function subirImagenReto(file){
  const blob = await comprimirImagenReto(file);
  const nombreArchivo = `reto_${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
  const res = await fetch(`${SUPABASE_URL}storage/v1/object/retos-fotos/${nombreArchivo}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "image/jpeg" },
    body: blob
  });
  if (!res.ok) throw new Error("Error al subir la imagen");
  return `${SUPABASE_URL}storage/v1/object/public/retos-fotos/${nombreArchivo}`;
}

async function enviarRespuestaPersonalizada(){
  const btn = document.getElementById("btnEnviarRespuesta");
  const respuestas = {};
  for (let idx = 0; idx < reto.preguntas.length; idx++) {
    const p = reto.preguntas[idx];

    if (p.tipo === "imagen") {
      const fileInput = document.getElementById(`preg_${idx}`);
      const comentario = document.getElementById(`preg_${idx}_comentario`)?.value.trim() || "";
      const archivos = fileInput?.files ? Array.from(fileInput.files) : [];
      if (p.requerido && archivos.length === 0) {
        alert(`Por favor sube al menos 1 imagen para: "${p.etiqueta}"`);
        return;
      }
      if (archivos.length > 2) {
        alert(`Puedes subir máximo 2 imágenes para: "${p.etiqueta}"`);
        return;
      }
      if (archivos.length > 0) {
        btn.disabled = true; btn.textContent = archivos.length > 1 ? "Subiendo imágenes..." : "Subiendo imagen...";
        try {
          const urls = [];
          for (const archivo of archivos) {
            urls.push(await subirImagenReto(archivo));
          }
          respuestas[p.etiqueta] = { urls, comentario };
        } catch (e) {
          btn.disabled = false; btn.textContent = "✅ Enviar entrada";
          alert("No se pudo subir la imagen, intenta de nuevo.");
          return;
        }
      } else {
        respuestas[p.etiqueta] = { urls: [], comentario };
      }
      continue;
    }

    const valor = leerValorPregunta(p, idx);
    const vacio = Array.isArray(valor) ? valor.length === 0 : !valor;
    if (p.requerido && vacio) {
      alert(`Por favor completa: "${p.etiqueta}"`);
      return;
    }
    respuestas[p.etiqueta] = valor;
  }
  btn.disabled = true; btn.textContent = "Enviando...";
  try {
    await fetch(`${SUPABASE_URL}rest/v1/retos_respuestas`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ reto_id: reto.id, nombre: usuarioActual.nombre, wsp: usuarioActual.wsp, email: usuarioActual.email, respuestas })
    });
    historialRetoCache = null;
    render(`
      <div class="ok-msg">
        <div class="icono">✅</div>
        <h1>¡Entrada registrada!</h1>
        <div class="desc">Gracias por tu entrada. 🌿</div>
        <button onclick="renderFormularioPersonalizado()">➕ Agregar otra entrada</button>
        <button type="button" class="btn-secundario" id="btnToggleHistorialReto" onclick="toggleHistorialReto()">📜 Ver mi historial</button>
        <div id="historialRetoWrap" style="display:none">
          <div id="historialRetoLista"></div>
        </div>
      </div>
    `);
  } catch (e) {
    btn.disabled = false; btn.textContent = "✅ Enviar entrada";
    alert("Hubo un error, intenta de nuevo.");
  }
}
