<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feedback — Jar Jar Green</title>
<meta property="og:title" content="Feedback 💬 — Jar Jar Green">
<meta property="og:description" content="Cuéntanos qué te pareció — tu opinión nos ayuda a mejorar 🌿">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jarjargreen.com/feedback.html">
<meta property="og:locale" content="es_PE">
<meta property="og:image" content="https://jarjargreen.com/og-image.jpg">
<meta property="og:image:secure_url" content="https://jarjargreen.com/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Jar Jar Green — Plantas y tecnología en Lima, Perú">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde-oscuro: #1a2e1c; --verde-hoja: #2a7a3b; --crema: #edf7ed;
    --gris: #6b8a6d; --borde: #d0e8d2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'DM Sans', sans-serif;
    background-image: url('fondo-vivo.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--verde-oscuro); min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 24px 16px;
  }
  @media (max-width: 600px) {
    body { background-image: url('fondo-vivo-mobile.jpg'); background-attachment: scroll; }
  }
  .card {
    background: #fff; border-radius: 20px; padding: 32px 28px; max-width: 440px; width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .logo { font-family: 'Spectral', serif; font-weight: 700; font-size: 1.1rem; color: var(--verde-hoja); text-align: center; margin-bottom: 4px; }
  .icono { text-align: center; font-size: 2.2rem; margin-bottom: 8px; }
  h1 { font-family: 'Spectral', serif; font-size: 1.4rem; text-align: center; margin: 0 0 10px; line-height: 1.3; }
  .desc { font-size: 0.9rem; color: var(--gris); line-height: 1.6; white-space: pre-wrap; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--gris); margin-bottom: 5px; }
  input, textarea, select {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--borde); border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; background: #fafffb;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--verde-hoja); }
  textarea { resize: vertical; min-height: 70px; }
  button {
    width: 100%; background: var(--verde-hoja); color: #fff; border: none; border-radius: 10px;
    padding: 13px; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.92rem;
    cursor: pointer; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  button:hover:not(:disabled) { background: #1f6030; }
  button:disabled { background: #d8ddd8; color: #6b756c; cursor: default; }
  .btn-google { background: #fff; color: #1a2e1c; border: 1.5px solid var(--borde); }
  .btn-google:hover { background: #f7fbf7; }
  .estado-msg { text-align: center; font-size: 0.9rem; color: var(--gris); padding: 20px 0; }
  .ok-msg { text-align: center; padding: 10px 0; }
  .ok-msg .icono { margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">🌿 JAR JAR GREEN</div>
  <div id="contenido"><div class="estado-msg">Cargando...</div></div>
</div>

<script>
const SUPABASE_URL = "https://saejzjhxarlbdmrgjeuc.supabase.co/";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhZWp6amh4YXJsYmRtcmdqZXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMjM1NTgsImV4cCI6MjA5Nzg5OTU1OH0.pG6hVqYmt2CSjxx5iHcz1Hm3DzNGScyP0P4SlP4Qxzo";

const params = new URLSearchParams(location.search);
const feedbackSlug = params.get("f");
let feedback = null;

function formatoWhatsapp(texto){
  if (!texto) return "";
  let resultado = texto
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(\S(?:[^*]*\S)?)\*/g, "<strong>$1</strong>")
    .replace(/_(\S(?:[^_]*\S)?)_/g, "<em>$1</em>")
    .replace(/~(\S(?:[^~]*\S)?)~/g, "<s>$1</s>");
  resultado = resultado.replace(/(https?:\/\/[^\s<]+)/g, (match, url, offset, str) => {
    const antes = str.slice(0, offset);
    const aberturasA = (antes.match(/<a /g) || []).length;
    const cierresA = (antes.match(/<\/a>/g) || []).length;
    if (aberturasA > cierresA) return match;
    return `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
  });
  return resultado;
}

function render(html){ document.getElementById("contenido").innerHTML = html; }

async function init(){
  if (!feedbackSlug) { render('<div class="estado-msg">Este link no es válido. Pídele el link correcto a quien te lo compartió. 🌿</div>'); return; }

  try {
    const res = await fetch(`${SUPABASE_URL}rest/v1/feedbacks?slug=eq.${encodeURIComponent(feedbackSlug)}&select=*`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    feedback = data?.[0];
  } catch (e) { feedback = null; }

  if (!feedback || !feedback.activo) {
    render('<div class="estado-msg">Este feedback ya no está disponible. 🌿</div>');
    return;
  }

  if (feedback.finalizado) {
    render(`
      <div class="icono">🏁</div>
      <h1>${formatoWhatsapp(feedback.titulo)}</h1>
      <div class="estado-msg">Este feedback ya no acepta más respuestas. ¡Gracias por tu interés! 🌿</div>
    `);
    return;
  }

  renderFormularioFeedback();
}

function renderCampoPregunta(p, idx){
  const nombreCampo = `preg_${idx}`;
  const marcaReq = p.requerido ? ' *' : '';
  if (p.tipo === "texto") {
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label><input type="text" id="${nombreCampo}"></div>`;
  }
  if (p.tipo === "parrafo") {
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label><textarea id="${nombreCampo}"></textarea></div>`;
  }
  if (p.tipo === "select") {
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label><select id="${nombreCampo}"><option value="">Selecciona...</option>${(p.opciones||[]).map(o=>`<option value="${o}">${o}</option>`).join("")}</select></div>`;
  }
  if (p.tipo === "radio") {
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label>
      ${(p.opciones||[]).map(o => `<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:6px"><input type="radio" name="${nombreCampo}" value="${o}" style="width:auto"> ${o}</label>`).join("")}
      ${p.permiteOtro ? `<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:6px"><input type="radio" name="${nombreCampo}" value="__otro__" style="width:auto"> Otro:</label><input type="text" id="${nombreCampo}_otro" placeholder="Especifica...">` : ""}
    </div>`;
  }
  if (p.tipo === "checkbox") {
    return `<div class="form-group"><label>${p.etiqueta}${marcaReq}</label>
      ${(p.opciones||[]).map(o => `<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:6px"><input type="checkbox" name="${nombreCampo}" value="${o}" style="width:auto"> ${o}</label>`).join("")}
      ${p.permiteOtro ? `<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:6px"><input type="checkbox" id="${nombreCampo}_otro_check" style="width:auto"> Otro:</label><input type="text" id="${nombreCampo}_otro" placeholder="Especifica...">` : ""}
    </div>`;
  }
  return "";
}

function renderFormularioFeedback(){
  const preguntas = Array.isArray(feedback.preguntas) ? feedback.preguntas : [];
  render(`
    <div class="icono">💬</div>
    <h1>${formatoWhatsapp(feedback.titulo)}</h1>
    <div class="desc">${formatoWhatsapp(feedback.descripcion)}</div>
    <div style="font-size:0.75rem;color:var(--gris);margin-bottom:14px">🔒 Este feedback es anónimo — no se guarda tu nombre ni identidad.</div>
    <div style="position:absolute;left:-9999px;top:-9999px;opacity:0;height:0;overflow:hidden" aria-hidden="true">
      <label>No llenar este campo<input type="text" id="campoTrampa" name="sitio_web" tabindex="-1" autocomplete="off"></label>
    </div>
    ${preguntas.map((p, idx) => renderCampoPregunta(p, idx)).join("")}
    <button id="btnEnviarFeedback" onclick="enviarFeedback()">✅ Enviar feedback</button>
  `);
}

function leerValorPregunta(p, idx){
  const nombreCampo = `preg_${idx}`;
  if (p.tipo === "texto" || p.tipo === "parrafo") return document.getElementById(nombreCampo).value.trim();
  if (p.tipo === "select") return document.getElementById(nombreCampo).value;
  if (p.tipo === "radio") {
    const el = document.querySelector(`input[name="${nombreCampo}"]:checked`);
    if (!el) return "";
    if (el.value === "__otro__") return document.getElementById(`${nombreCampo}_otro`)?.value.trim() || "";
    return el.value;
  }
  if (p.tipo === "checkbox") {
    const seleccionados = Array.from(document.querySelectorAll(`input[name="${nombreCampo}"]:checked`)).map(el => el.value);
    if (document.getElementById(`${nombreCampo}_otro_check`)?.checked) {
      const otroTexto = document.getElementById(`${nombreCampo}_otro`)?.value.trim();
      if (otroTexto) seleccionados.push(otroTexto);
    }
    return seleccionados;
  }
  return "";
}

async function enviarFeedback(){
  const trampa = document.getElementById("campoTrampa");
  if (trampa && trampa.value.trim()) {
    // Un bot llenó el campo invisible — mostramos éxito pero no
    // guardamos nada, sin avisarle que fue detectado.
    render(`
      <div class="ok-msg">
        <div class="icono">✅</div>
        <h1>¡Gracias por tu feedback!</h1>
        <div class="desc">Tu respuesta fue registrada. 🌿</div>
        <button onclick="renderFormularioFeedback()">➕ Mandar otro feedback</button>
      </div>
    `);
    return;
  }
  const preguntas = Array.isArray(feedback.preguntas) ? feedback.preguntas : [];
  const respuestas = {};
  for (let idx = 0; idx < preguntas.length; idx++) {
    const p = preguntas[idx];
    const valor = leerValorPregunta(p, idx);
    const vacio = Array.isArray(valor) ? valor.length === 0 : !valor;
    if (p.requerido && vacio) {
      alert(`Por favor completa: "${p.etiqueta}"`);
      return;
    }
    respuestas[p.etiqueta] = valor;
  }
  const btn = document.getElementById("btnEnviarFeedback");
  btn.disabled = true; btn.textContent = "Enviando...";
  try {
    await fetch(`${SUPABASE_URL}rest/v1/feedback_respuestas`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ feedback_id: feedback.id, nombre: null, wsp: null, email: null, respuestas })
    });
    render(`
      <div class="ok-msg">
        <div class="icono">✅</div>
        <h1>¡Gracias por tu feedback!</h1>
        <div class="desc">Tu respuesta fue registrada. 🌿</div>
        <button onclick="renderFormularioFeedback()">➕ Mandar otro feedback</button>
      </div>
    `);
  } catch (e) {
    btn.disabled = false; btn.textContent = "✅ Enviar feedback";
    alert("Hubo un error, intenta de nuevo.");
  }
}

init();
</script>
</body>
</html>
