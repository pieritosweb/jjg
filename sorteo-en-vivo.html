<style>
  :root { --verde-oscuro: #1a2e1c; --verde-hoja: #2a7a3b; --crema: #edf7ed; }

  .sorteo-box { background: linear-gradient(135deg,#2f6b3f,#4a9c5c); border-radius: 18px; padding: 26px 18px; }
  .sorteo-reel-wrap {

  .sorteo-reel { display: flex; flex-direction: column; will-change: transform; }
  .sorteo-reel-item {
    height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;

  @media (max-width: 420px) {

  .sorteo-fila-reel { display: flex; align-items: center; justify-content: center; gap: 8px; }

<script>
const SUPABASE_URL = "https://saejzjhxarlbdmrgjeuc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhZWp6amh4YXJsYmRtcmdqZXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMjM1NTgsImV4cCI6MjA5Nzg5OTU1OH0.pG6hVqYmt2CSjxx5iHcz1Hm3DzNGScyP0P4SlP4Qxzo";
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ITEM_H = 50;

function celebrarGanadorSorteo(){
  const colores = ['#ffd54f', '#2f6b3f', '#4a9c5c', '#fdf6e8', '#c99a1f'];
  for (let i = 0; i < 45; i++) {
    const conf = document.createElement('div');
    conf.className = 'sorteo-confetti';
    conf.style.left = Math.random() * 100 + 'vw';
    conf.style.background = colores[Math.floor(Math.random() * colores.length)];
    conf.style.animationDuration = (2.2 + Math.random() * 1.4) + 's';
    conf.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(conf);
    setTimeout(() => conf.remove(), 4200);
  }
}
let intervaloEsperaSorteo = null;
function iniciarAnimacionEspera(){
  detenerAnimacionEspera();
  let punto = 0;
  intervaloEsperaSorteo = setInterval(() => {
    const el = document.getElementById('textoEsperaSorteo');
    if (!el) { detenerAnimacionEspera(); return; }
    punto = (punto + 1) % 4;
    el.textContent = 'Esperando el sorteo' + '.'.repeat(punto);
  }, 500);
}
function detenerAnimacionEspera(){
  if (intervaloEsperaSorteo) { clearInterval(intervaloEsperaSorteo); intervaloEsperaSorteo = null; }
}
let sorteoInicioEn = null;
let intervaloCuentaInicioSorteo = null;
function detenerCuentaInicioSorteo(){
  if (intervaloCuentaInicioSorteo) { clearInterval(intervaloCuentaInicioSorteo); intervaloCuentaInicioSorteo = null; }
}
function iniciarEsperaOContador(){
  detenerAnimacionEspera();
  detenerCuentaInicioSorteo();
  if (sorteoInicioEn && new Date(sorteoInicioEn) > new Date()) {
    function actualizar(){
      const el = document.getElementById('textoEsperaSorteo');
      if (!el) { detenerCuentaInicioSorteo(); return; }
      const restanteMs = new Date(sorteoInicioEn) - new Date();
      if (restanteMs <= 0) {
        detenerCuentaInicioSorteo();
        iniciarAnimacionEspera();
        return;
      }
      const totalSeg = Math.floor(restanteMs / 1000);
      const h = Math.floor(totalSeg / 3600);
      const m = Math.floor((totalSeg % 3600) / 60);
      const s = totalSeg % 60;
      const pad = n => String(n).padStart(2, "0");
      el.textContent = `Empieza en ${pad(h)}:${pad(m)}:${pad(s)}`;
    }
    actualizar();
    intervaloCuentaInicioSorteo = setInterval(actualizar, 1000);
  } else {
    iniciarAnimacionEspera();
  }
}
function resetReelSorteoVivo(){
  const reel = document.getElementById('sorteoReel');
  if (!reel) return;
  reel.style.transition = 'none';
  reel.style.transform = 'translateY(0)';
  reel.innerHTML = `
    <div class="sorteo-reel-item">🎉</div>
    <div class="sorteo-reel-item sorteo-reel-espera" id="textoEsperaSorteo">Esperando el sorteo</div>
    <div class="sorteo-reel-item">🎉</div>`;
  iniciarEsperaOContador();
}
function girarReelEnVivo(nombres, duracion, indexGanador, tituloPremio){
  detenerAnimacionEspera();
  const header = document.getElementById('premioActualHeaderVivo');
  if (header) {
    if (tituloPremio) { header.textContent = `🏆 Ganador ${tituloPremio}`; header.style.display = 'block'; }
    else header.style.display = 'none';
  }
  const reel = document.getElementById('sorteoReel');
  reel.style.transition = 'none';
  reel.style.transform = 'translateY(0)';
  reel.innerHTML = nombres.map(n => `<div class="sorteo-reel-item">${n}</div>`).join('');
  void reel.offsetHeight;

  const finalPos = -(ITEM_H * (indexGanador - 1));

  requestAnimationFrame(() => {
    reel.style.transition = `transform ${duracion}s cubic-bezier(0.22, 0.4, 0.15, 1)`;
    reel.style.transform = `translateY(${finalPos}px)`;
  });

  setTimeout(() => {
    const items = reel.querySelectorAll('.sorteo-reel-item');
    items[indexGanador]?.classList.add('centro');
    const estadoEl = document.getElementById('estado');
    estadoEl.textContent = `🎉 ¡Ganó ${nombres[indexGanador]}!`;
    estadoEl.style.fontSize = '1.5rem';
    estadoEl.style.fontWeight = '800';
    estadoEl.style.color = 'var(--verde-hoja, #2a7a3b)';
    celebrarGanadorSorteo();
  }, duracion * 1000 + 150);
}

const params = new URLSearchParams(location.search);
const slugSorteo = params.get('s');

function formatoWhatsapp(texto){
  if (!texto) return "";
  let resultado = texto
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(\S(?:[^*]*\S)?)\*/g, "<strong>$1</strong>")
    .replace(/_(\S(?:[^_]*\S)?)_/g, "<em>$1</em>")
    .replace(/~(\S(?:[^~]*\S)?)~/g, "<s>$1</s>");
  resultado = resultado.replace(/(https?:\/\/[^\s<]+)/g, (match, url, offset, str) => {
    const antes = str.slice(0, offset);
    const aberturasA = (antes.match(/<a /g) || []).length;
    const cierresA = (antes.match(/<\/a>/g) || []).length;
    if (aberturasA > cierresA) return match;
    return `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
  });
  return resultado;
}

function mostrarPremioInfo(titulo, premios){
  if (titulo) {
    const tituloEl = document.getElementById('tituloSorteoVivo');
    tituloEl.innerHTML = formatoWhatsapp(titulo);
    tituloEl.style.display = 'block';
  }
  const cont = document.getElementById('premiosListaVivo');
  if (Array.isArray(premios) && premios.length) {
    cont.innerHTML = premios.map(p => `
      <div class="premio-bloque-vivo">
        ${p.titulo ? `<div class="premio-titulo-vivo">🎁 ${formatoWhatsapp(p.titulo)}</div>` : ''}
        ${Array.isArray(p.imagenes) && p.imagenes.length ? `
          <div class="sorteo-thumbs">
            ${p.imagenes.map(url => `<img class="sorteo-thumb" src="${url}" onclick="abrirLightboxSorteo('${url.replace(/'/g,"\\'")}')">`).join('')}
          </div>` : ''}
      </div>`).join('');
  }
}
function actualizarListaParticipantesVivo(nombresNuevos){
  const cont = document.getElementById('listaParticipantesVivo');
  const actuales = Array.from(cont.querySelectorAll('.sorteo-chip-vivo'));
  const setNuevos = new Set(nombresNuevos);
  actuales.forEach(chip => {
    if (!setNuevos.has(chip.textContent)) {
      chip.classList.add('sorteo-chip-vivo-removido');
      setTimeout(() => chip.remove(), 400);
    }
  });
  const textosActuales = new Set(actuales.map(c => c.textContent));
  nombresNuevos.forEach(n => {
    if (!textosActuales.has(n)) {
      const span = document.createElement('span');
      span.className = 'sorteo-chip-vivo';
      span.textContent = n;
      cont.appendChild(span);
    }
  });
}
function resetEstiloEstado(){
  const el = document.getElementById('estado');
  el.style.fontSize = '';
  el.style.fontWeight = '';
  el.style.color = '';
}

function abrirLightboxSorteo(url){
  document.getElementById('lightboxImgSorteo').src = url;
  document.getElementById('lightboxSorteoVivo').classList.add('active');
}
function cerrarLightboxSorteo(){
  document.getElementById('lightboxSorteoVivo').classList.remove('active');
}

function mostrarVistaResumen(ganadorNombre, ganadores){
  detenerAnimacionEspera();
  document.getElementById('estado').style.display = 'none';
  document.getElementById('sorteoBoxVivo').style.display = 'none';
  document.getElementById('listaParticipantesVivo').style.display = 'none';
  if (Array.isArray(ganadores) && ganadores.length) {
    mostrarResumenCompletoVivo(ganadores);
    return;
  }
  document.getElementById('nombreGanadorResumen').textContent = ganadorNombre ? `¡Ganó ${ganadorNombre}!` : 'Sorteo finalizado';
  document.getElementById('resumenGanadorVivo').style.display = 'block';
}
function mostrarVistaEnVivo(){
  document.getElementById('resumenGanadorVivo').style.display = 'none';
  document.getElementById('resumenCompletoVivo').style.display = 'none';
  const header = document.getElementById('premioActualHeaderVivo');
  if (header) header.style.display = 'none';
  document.getElementById('estado').style.display = '';
  document.getElementById('sorteoBoxVivo').style.display = '';
  document.getElementById('listaParticipantesVivo').style.display = '';
  resetReelSorteoVivo();
  resetEstiloEstado();
  document.getElementById('estado').textContent = 'Conectado — esperando a que empiece el sorteo';
}
function mostrarResumenCompletoVivo(ganadores){
  detenerAnimacionEspera();
  document.getElementById('estado').style.display = 'none';
  document.getElementById('sorteoBoxVivo').style.display = 'none';
  document.getElementById('listaParticipantesVivo').style.display = 'none';
  document.getElementById('resumenGanadorVivo').style.display = 'none';
  const cont = document.getElementById('resumenCompletoVivo');
  cont.innerHTML = `
    <div style="font-weight:700;margin-bottom:8px;font-family:'Spectral',serif;font-size:1.15rem;text-align:center">🎉 ¡Sorteo completo!</div>
    ${ganadores.map(g => `<div style="margin-bottom:4px;text-align:center">${g.titulo ? '🏆 ' + formatoWhatsapp(g.titulo) + ': ' : ''}<strong>${g.nombre}</strong></div>`).join('')}
  `;
  cont.style.display = 'block';
}

async function iniciarSorteoEnVivo(){
  if (!slugSorteo) {
    resetEstiloEstado();
    document.getElementById('estado').textContent = 'Link inválido — pídele el link correcto a quien te lo compartió. 🌿';
    document.getElementById('sorteoBoxVivo').style.display = 'none';
    document.getElementById('listaParticipantesVivo').style.display = 'none';
    return;
  }
  let fila = null;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/sorteos_historial?slug=eq.${encodeURIComponent(slugSorteo)}&select=activo,finalizado,titulo,premios,ganador_nombre,ganadores,inicia_en,participantes_actuales`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    fila = Array.isArray(data) && data.length > 0 ? data[0] : null;
  } catch (e) {}

  if (!fila || fila.activo !== true) {
    resetEstiloEstado();
    document.getElementById('estado').textContent = 'Este sorteo ya no está disponible. 🌿';
    document.getElementById('sorteoBoxVivo').style.display = 'none';
    document.getElementById('listaParticipantesVivo').style.display = 'none';
    return;
  }

  mostrarPremioInfo(fila.titulo, fila.premios);
  sorteoInicioEn = fila.inicia_en || null;

  if (fila.finalizado) {
    mostrarVistaResumen(fila.ganador_nombre, fila.ganadores);
  } else {
    iniciarEsperaOContador();
    if (Array.isArray(fila.participantes_actuales) && fila.participantes_actuales.length) {
      actualizarListaParticipantesVivo(fila.participantes_actuales);
    }
  }

  const canal = sbClient.channel('sorteo-vivo-' + slugSorteo);
  canal
    .on('broadcast', { event: 'girar' }, ({ payload }) => {
      mostrarVistaEnVivo();
      resetEstiloEstado();
      document.getElementById('estado').textContent = '🎲 ¡Girando ahora!';
      const mango = document.getElementById('palancaMango');
      if (mango) {
        mango.classList.add('tirada');
        setTimeout(() => mango.classList.remove('tirada'), 350);
      }
      girarReelEnVivo(payload.nombres, payload.duracion, payload.indexGanador, payload.tituloPremio);
    })
    .on('broadcast', { event: 'participantes' }, ({ payload }) => {
      actualizarListaParticipantesVivo(payload.nombres);
      const reel = document.getElementById('sorteoReel');
      const centro = reel?.querySelector('.sorteo-reel-item.centro');
      if (centro) {
        centro.classList.add('sorteo-reel-item-removido');
        setTimeout(() => resetReelSorteoVivo(), 380);
      }
    })
    .on('broadcast', { event: 'actualizar_info' }, ({ payload }) => {
      sorteoInicioEn = payload.inicia_en || null;
      mostrarVistaEnVivo();
      mostrarPremioInfo(payload.titulo, payload.premios);
    })
    .on('broadcast', { event: 'finalizar' }, ({ payload }) => {
      mostrarVistaResumen(payload.ganador_nombre, payload.ganadores);
    })
    .on('broadcast', { event: 'sorteo_completo' }, ({ payload }) => {
      mostrarResumenCompletoVivo(payload.ganadores || []);
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED' && !fila.finalizado) {
        resetEstiloEstado();
  document.getElementById('estado').textContent = 'Conectado — esperando a que empiece el sorteo';
      }
    });
}

iniciarSorteoEnVivo();
</script>
</body>
</html>
