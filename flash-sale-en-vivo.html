<script>
const SUPABASE_URL = "https://saejzjhxarlbdmrgjeuc.supabase.co/";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhZWp6amh4YXJsYmRtcmdqZXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMjM1NTgsImV4cCI6MjA5Nzg5OTU1OH0.pG6hVqYmt2CSjxx5iHcz1Hm3DzNGScyP0P4SlP4Qxzo";
const sbClient = window.supabase.createClient(SUPABASE_URL.replace(/\/$/,""), SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "jjg_auth", storage: window.localStorage }
});

const params = new URLSearchParams(location.search);
const flashSlug = params.get("s");
let usuarioActual = null;
let flash = null;
let productos = [];

function formatoWhatsapp(texto){
  if (!texto) return "";
  let resultado = texto
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(\S(?:[^*]*\S)?)\*/g, "<strong>$1</strong>")
    .replace(/_(\S(?:[^_]*\S)?)_/g, "<em>$1</em>")
    .replace(/~(\S(?:[^~]*\S)?)~/g, "<s>$1</s>");
  resultado = resultado.replace(/(https?:\/\/[^\s<]+)/g, (match, url, offset, str) => {
    const antes = str.slice(0, offset);
    const aberturasA = (antes.match(/<a /g) || []).length;
    const cierresA = (antes.match(/<\/a>/g) || []).length;
    if (aberturasA > cierresA) return match;
    return `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
  });
  return resultado;
}
let carrito = {};
let lbFotos = [];
let lbIdx = 0;

function abrirLightboxFlash(itemId){
  const item = productos.find(p => p.id === itemId);
  if (!item) return;
  lbFotos = Array.isArray(item.imagenes) && item.imagenes.length ? item.imagenes : [];
  if (!lbFotos.length) return;
  lbIdx = 0;
  renderLightboxFlash();
  document.getElementById("flashLightbox").classList.add("active");
}
function renderLightboxFlash(){
  document.getElementById("flashLbImg").src = lbFotos[lbIdx];
  document.getElementById("flashLbCounter").textContent = lbFotos.length > 1 ? `${lbIdx + 1} / ${lbFotos.length}` : "";
  document.getElementById("flashLbPrev").style.display = lbFotos.length > 1 ? "" : "none";
  document.getElementById("flashLbNext").style.display = lbFotos.length > 1 ? "" : "none";
}
function lbNavFlash(delta){
  lbIdx = (lbIdx + delta + lbFotos.length) % lbFotos.length;
  renderLightboxFlash();
}
function lbTapNavFlash(e){
  e.stopPropagation();
  if (lbFotos.length <= 1) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - rect.left;
  lbNavFlash(x < rect.width / 2 ? -1 : 1);
}
function cerrarLightboxFlash(e){
  if (e && e.target !== document.getElementById("flashLightbox")) return;
  document.getElementById("flashLightbox").classList.remove("active");
}
(function(){
  const el = document.getElementById("flashLightbox");
  if (!el) return;
  let startX = 0, startY = 0, tocando = false;
  el.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; tocando = true; }, { passive: true });
  el.addEventListener("touchmove", (e) => { if (tocando) e.preventDefault(); }, { passive: false });
  el.addEventListener("touchend", (e) => {
    if (!tocando) return;
    tocando = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50 && lbFotos.length > 1) lbNavFlash(dx < 0 ? 1 : -1);
  }, { passive: true });
})();
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("flashLightbox").classList.contains("active")) return;
  if (e.key === "ArrowLeft") lbNavFlash(-1);
  if (e.key === "ArrowRight") lbNavFlash(1);
  if (e.key === "Escape") cerrarLightboxFlash({ target: document.getElementById("flashLightbox") });
});


function resolverWsp(userId){
  return localStorage.getItem("jjg_wsp_" + userId) || null;
}

function textoStock(stockDisponible, esPack){
  if (stockDisponible <= 0) return { texto: "😢 ¡Agotado! Ya no queda de esta", ultima: false };
  if (stockDisponible === 1) return { texto: esPack ? "⚠️ ¡Último pack disponible!" : "⚠️ ¡Última unidad disponible!", ultima: true };
  return { texto: `🟢 ${stockDisponible} ${esPack ? "packs" : "unidades"} disponibles`, ultima: false };
}

async function init(){
  if (!flashSlug) { mostrarSoloMensaje("Link inválido — pídele el link correcto a quien te lo compartió. 🌿"); return; }

  const { data: { session } } = await sbClient.auth.getSession();
  if (session?.user) {
    usuarioActual = {
      id: session.user.id,
      nombre: session.user.user_metadata?.full_name || session.user.email,
      email: session.user.email,
      wsp: resolverWsp(session.user.id)
    };
  }

  await cargarFlashYRenderizar();
  suscribirseAFlashVivo();
}

function mostrarSoloMensaje(msg){
  detenerCountdown();
  document.getElementById("contenido").innerHTML = `<div class="card"><div class="estado-msg">${msg}</div></div>`;
  document.getElementById("carritoBarra").classList.remove("visible");
}

async function cargarFlashYRenderizar(){
  try {
    const res = await fetch(`${SUPABASE_URL}rest/v1/flash_sales?slug=eq.${encodeURIComponent(flashSlug)}&select=*`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    flash = data?.[0] || null;
  } catch (e) { flash = null; }

  if (flash && flash.activo && flash.expira_en && new Date(flash.expira_en) <= new Date()) {
    flash.activo = false;
    fetch(`${SUPABASE_URL}rest/v1/rpc/finalizar_flash_sale_si_expiro`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({ p_slug: flashSlug })
    }).catch(() => {});
  }

  if (!flash || !flash.activo) { mostrarSoloMensaje("Esta oferta ya no está disponible. 🌿"); return; }

  if (flash.oculto_temporal) { mostrarSoloMensaje("Esta oferta está en mantenimiento por un momento — vuelve a intentarlo en un rato. 🌿"); return; }

  try {
    const res = await fetch(`${SUPABASE_URL}rest/v1/flash_sale_items?flash_sale_id=eq.${flash.id}&select=item_id,precio_descuento,stock_asignado,items(*)&order=orden.asc`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    const resVendidos = await fetch(`${SUPABASE_URL}rest/v1/reservas?flash_sale_slug=eq.${flashSlug}&select=item_id,cantidad`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const vendidosData = await resVendidos.json();
    const packSizePorItem = {};
    (data || []).forEach(d => { if (d.items) packSizePorItem[d.item_id] = d.items.pack_size || 1; });
    const vendidoPorItem = {};
    (Array.isArray(vendidosData) ? vendidosData : []).forEach(v => { vendidoPorItem[v.item_id] = (vendidoPorItem[v.item_id] || 0) + (v.cantidad * (packSizePorItem[v.item_id] || 1)); });
    productos = (data || []).filter(d => d.items).map(d => {
      const vendido = vendidoPorItem[d.item_id] || 0;
      const stockFlashRestante = Math.max(0, (d.stock_asignado || 0) - vendido);
      return { ...d.items, precio_descuento: d.precio_descuento, stock: Math.min(stockFlashRestante, d.items.stock) };
    });
  } catch (e) { productos = []; }

  if (!productos.length) { mostrarSoloMensaje("Esta oferta ya no está disponible. 🌿"); return; }

  carrito = {};
  const btnReservar = document.getElementById("btnReservarCarrito");
  if (btnReservar) { btnReservar.disabled = false; btnReservar.textContent = "⚡ Reservar todo con descuento"; }
  renderTodo();
}

function precioFinal(item){
  return item.precio_descuento;
}

function renderTodo(){
  let accionInicial = "";
  if (!usuarioActual) {
    accionInicial = `
      <button class="btn-google" onclick="loginGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>
        Ingresar con Google para reservar
      </button>`;
  } else if (!usuarioActual.wsp) {
    accionInicial = `
      <div class="form-group">
        <label>Tu WhatsApp (para coordinar tu compra)</label>
        <input type="tel" id="fWsp" placeholder="Ej: 987654321" maxlength="9">
      </div>
      <button class="btn-principal" onclick="guardarWspInline()">Continuar</button>`;
  }

  const listoParaComprar = !!(usuarioActual && usuarioActual.wsp);

  const productosHtml = productos.map(item => {
    const esPack = item.pack_size > 1;
    const stockDisponible = esPack ? Math.floor(item.stock / item.pack_size) : item.stock;
    const st = textoStock(stockDisponible, esPack);
    const fotos = Array.isArray(item.imagenes) ? item.imagenes : [];
    const img = fotos[0] || "";
    const cant = carrito[item.id] || 0;
    return `
    <div class="card producto-card">
      ${img ? `<div class="producto-img-wrap" onclick="abrirLightboxFlash(${item.id})"><img class="producto-img" src="${img}">${fotos.length > 1 ? `<span class="producto-img-count">${fotos.length}</span>` : ""}</div>` : '<div class="producto-img"></div>'}
      <div class="producto-info">
        <div class="producto-nombre">${item.nombre}</div>
        <div class="producto-precios">
          <span class="precio-original">S/ ${item.precio}${esPack ? "/pack" : ""}</span>
          <span class="precio-final">S/ ${precioFinal(item)}${esPack ? "/pack" : ""}</span>
        </div>
        <div class="producto-stock ${st.ultima ? "ultima" : ""}">${st.texto}</div>
        ${listoParaComprar && stockDisponible > 0 ? `
        <div class="qty-row">
          <button class="qty-btn" onclick="cambiarCantidad(${item.id},-1)" ${cant<=0?"disabled":""}>−</button>
          <div class="qty-num">${cant}</div>
          <button class="qty-btn" onclick="cambiarCantidad(${item.id},1)" ${cant>=stockDisponible?"disabled":""}>+</button>
        </div>` : ""}
      </div>
    </div>`;
  }).join("");

  document.getElementById("contenido").innerHTML = `
    <div class="card">
      ${flash.titulo ? `<div class="flash-titulo">${formatoWhatsapp(flash.titulo)}</div>` : ""}
      <div class="flash-badge-wrap"><span class="flash-badge">⚡ OFERTAS FLASH</span></div>
      ${flash.expira_en ? `<div class="flash-countdown" id="flashCountdown"></div>` : ""}
      <div class="puntos-aviso">⚡ Los productos de esta oferta no acumulan ni se pueden pagar con JarJar Puntos.</div>
      ${accionInicial}
    </div>
    ${listoParaComprar ? productosHtml : ""}
  `;

  actualizarBarraCarrito();
  iniciarCountdown();
}

let intervaloCountdown = null;
function detenerCountdown(){
  if (intervaloCountdown) { clearInterval(intervaloCountdown); intervaloCountdown = null; }
}
function iniciarCountdown(){
  detenerCountdown();
  if (!flash || !flash.expira_en) return;
  const el = document.getElementById("flashCountdown");
  if (!el) return;

  function actualizar(){
    const restanteMs = new Date(flash.expira_en) - new Date();
    if (restanteMs <= 0) {
      detenerCountdown();
      mostrarSoloMensaje("⏰ Esta oferta ya terminó.");
      fetch(`${SUPABASE_URL}rest/v1/rpc/finalizar_flash_sale_si_expiro`, {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ p_slug: flashSlug })
      }).catch(() => {});
      return;
    }
    const totalSeg = Math.floor(restanteMs / 1000);
    const h = Math.floor(totalSeg / 3600);
    const m = Math.floor((totalSeg % 3600) / 60);
    const s = totalSeg % 60;
    const pad = n => String(n).padStart(2, "0");
    document.getElementById("flashCountdown").innerHTML =
      `<span class="unidad">${pad(h)}</span><span class="sep">:</span><span class="unidad">${pad(m)}</span><span class="sep">:</span><span class="unidad">${pad(s)}</span>`;
  }
  actualizar();
  intervaloCountdown = setInterval(actualizar, 1000);
}

function cambiarCantidad(itemId, delta){
  const item = productos.find(p => p.id === itemId);
  const esPack = item.pack_size > 1;
  const max = esPack ? Math.floor(item.stock / item.pack_size) : item.stock;
  const actual = carrito[itemId] || 0;
  const nuevo = Math.min(max, Math.max(0, actual + delta));
  if (nuevo <= 0) delete carrito[itemId];
  else carrito[itemId] = nuevo;
  renderTodo();
}

function actualizarBarraCarrito(){
  const barra = document.getElementById("carritoBarra");
  const idsEnCarrito = Object.keys(carrito);
  if (!idsEnCarrito.length) { barra.classList.remove("visible"); return; }
  let total = 0, unidades = 0;
  idsEnCarrito.forEach(id => {
    const item = productos.find(p => p.id === parseInt(id));
    if (!item) return;
    total += precioFinal(item) * carrito[id];
    unidades += carrito[id];
  });
  document.getElementById("carritoTotalTxt").innerHTML = `S/ ${total.toFixed(2)}<small>${unidades} ${unidades===1?"ítem":"ítems"}</small>`;
  barra.classList.add("visible");
}

async function loginGoogle(){
  await sbClient.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.href } });
}

function guardarWspInline(){
  const wsp = document.getElementById("fWsp").value.trim().replace(/\D/g,"");
  if (!wsp || wsp.length < 9) { alert("WhatsApp inválido"); return; }
  localStorage.setItem("jjg_wsp_" + usuarioActual.id, wsp);
  usuarioActual.wsp = wsp;
  renderTodo();
}

async function reservarCarrito(){
  const btn = document.getElementById("btnReservarCarrito");
  btn.disabled = true; btn.textContent = "Reservando...";
  const p_carrito = Object.keys(carrito).map(id => ({ item_id: parseInt(id), cantidad: carrito[id] }));
  try {
    const res = await fetch(`${SUPABASE_URL}rest/v1/rpc/crear_reserva_flash`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        p_slug: flashSlug,
        p_carrito,
        p_email: usuarioActual.email,
        p_nombre: usuarioActual.nombre,
        p_wsp: usuarioActual.wsp,
        p_nota_cliente: null,
        p_max_por_usuario: 5
      })
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      const msg = errData?.message || "";
      if (msg.startsWith("STOCK_INSUFICIENTE")) {
        const [, nombre, stock] = msg.split("|");
        alert(`😅 Ya no hay suficiente stock de ${nombre} (quedan ${stock}).`);
        await cargarFlashYRenderizar();
      } else if (msg.startsWith("LIMITE_EXCEDIDO")) {
        const [, nombre] = msg.split("|");
        alert(`Ya reservaste el máximo permitido de ${nombre} (5).`);
      } else if (msg.startsWith("FLASH_NO_DISPONIBLE")) {
        mostrarSoloMensaje("Esta oferta ya no está disponible. 🌿");
      } else {
        alert("Hubo un error, intenta de nuevo.");
      }
      btn.disabled = false; btn.textContent = "⚡ Reservar todo con descuento";
      return;
    }
    const data = await res.json();
    mostrarConfirmacion(data);
  } catch (e) {
    alert("Error de conexión, intenta de nuevo.");
    btn.disabled = false; btn.textContent = "⚡ Reservar todo con descuento";
  }
}

  detenerCountdown();

  const primerItem = productos.find(p => p.id === parseInt(primerItemId));

      <div style="font-weight:700;margin-top:8px">Total: S/ ${Number(data.total_a_pagar).toFixed(2)}</div>

        Avisar a ${nombreDestino} por WhatsApp
      </a>
      <button type="button" class="btn-seguir-reservando" onclick="cargarFlashYRenderizar()">🛍️ Seguir reservando más productos</button>
    </div>`;
}

function suscribirseAFlashVivo(){
  const canal = sbClient.channel("flash-vivo-" + flashSlug);
  canal
    .on("broadcast", { event: "actualizar_info" }, async () => {
      await cargarFlashYRenderizar();
    })
    .on("broadcast", { event: "pausado" }, () => {
      mostrarSoloMensaje("Esta oferta ya no está disponible. 🌿");
    })
    .subscribe();
}
